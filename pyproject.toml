[project]
name = "live-voice-translate"
version = "0.1.0"
description = "Real-time Chinese to English audio translation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argostranslate>=1.9.6",
    "glfw>=2.7",
    "pillow>=10",
    "pyopengl>=3.1",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "faster-whisper>=1.1.0",
    "numpy>=2.0",
    # CTranslate2 wheels link against CUDA 12 cuBLAS
    "nvidia-cublas-cu12>=12.4; sys_platform == 'linux'",
    "webrtcvad>=2.0.10",
    "cyclopts>=5.3.2",
]

[project.scripts]
lvt = "live_voice_translate.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "ruff>=0.15.18",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_voice_translate"]

[tool.hatch.build.targets.wheel.force-include]
"src/live_voice_translate/py.typed" = "live_voice_translate/py.typed"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]
