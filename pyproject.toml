[project]
name = "live-voice-translate"
version = "0.1.0"
description = "Real-time Chinese to English audio translation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argostranslate>=1.9.6",
    "faster-whisper>=1.1.0",
    "numpy>=2.0",
    # CTranslate2 wheels link against CUDA 12 cuBLAS
    "nvidia-cublas-cu12>=12.4; sys_platform == 'linux'",
    "webrtcvad>=2.0.10",
]

[project.scripts]
lvt = "lvt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["lvt.py"]
